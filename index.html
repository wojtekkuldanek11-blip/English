<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ćwiczenia z lukami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#7758e8;--pink:#ff6b9d;--green:#20b486;--bg:#f6f4ff;--card:#fff;--ink:#302d4a;--mut:#8b86a4;--line:#ebe7fb;--soft:#f4f0ff;--ok-bg:#e5fff5;--ok:#087c5a;--bad-bg:#fff0f4;--bad:#ce4264;--field:#faf9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17152a;--card:#221f3a;--ink:#ece9ff;--mut:#9d98bd;--line:#35315a;--soft:#2c2850;--ok-bg:#12382e;--ok:#5fe0b6;--bad-bg:#402032;--bad:#ff8fa8;--field:#1c1932}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.wrap{max-width:1000px;margin:auto}
.hero{text-align:center;padding:24px 18px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#7857e8,#b06af4,#ff78ad)}
.hero h1{margin:4px 0;font-size:clamp(22px,5vw,34px);font-weight:800}.hero p{margin:6px 0 0;opacity:.95;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px;margin-top:18px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.side .card,.main .card{margin-top:0}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid transparent}
.item:hover{background:var(--soft)}.item.on{background:var(--soft);border-color:var(--purple);color:var(--purple)}
.item small{color:var(--mut);font-weight:500}
input[type=text],textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:500 14px 'Poppins',sans-serif;outline:none}
input:focus,textarea:focus{border-color:var(--purple)}
textarea{min-height:200px;resize:vertical;line-height:1.7}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:12px 0 5px}
.btn{border:none;border-radius:12px;padding:10px 16px;font:700 13px 'Poppins',sans-serif;cursor:pointer;background:var(--soft);color:var(--purple)}
.btn:hover{transform:translateY(-1px)}
.btn.p{color:#fff;background:linear-gradient(100deg,#7858e8,#a16aef)}.btn.g{color:#fff;background:linear-gradient(100deg,#20b486,#3fd0a2)}.btn.d{color:var(--bad);background:var(--bad-bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600;margin:3px}
.gaprow{display:flex;gap:8px;align-items:center;margin:6px 0}.gaprow b{min-width:58px;font-size:12px;color:var(--purple)}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.big{border:3px solid var(--purple);background:linear-gradient(120deg,var(--soft),var(--card))}.pol{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}.polt{font-size:clamp(18px,3.4vw,24px);font-weight:800;line-height:1.4;margin-top:4px}
.dt{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px}.dt summary{cursor:pointer;font-weight:700;font-size:14px}
.dz{border:2px dashed var(--purple);border-radius:14px;padding:14px;text-align:center;font-size:13px;font-weight:600;color:var(--mut);margin-top:8px}.dz.on{background:var(--soft)}
.emo{display:inline-block;border:none;background:var(--soft);border-radius:10px;font-size:36px;padding:2px 8px;margin:3px;cursor:pointer;line-height:1.3}.emo:hover{transform:scale(1.15)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;background:var(--soft);color:var(--purple)}.tab.on{background:var(--purple);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px}
.sc{font-weight:800}.sc.hi{color:var(--ok)}.sc.lo{color:var(--bad)}
.tablewrap{overflow-x:auto}
.story{font-size:15px;line-height:2.7;flex:1;min-width:0}
.lay.has::after{content:"";display:block;clear:both}
.pics{float:right;width:min(38%,320px);margin:0 0 12px 18px}
.pics img{display:block;width:100%;border-radius:14px;margin-bottom:12px;border:1px solid var(--line)}
@media(max-width:560px){.pics{float:none;width:100%;margin:0 0 12px}}
.blank{width:140px;max-width:100%;padding:6px 9px;margin:3px;border:2px solid var(--line);border-radius:10px;background:var(--field);color:var(--purple);font:600 14px 'Poppins',sans-serif;outline:none;display:inline-block}
.blank:focus{border-color:var(--purple)}.blank.correct{border-color:var(--green);background:var(--ok-bg);color:var(--ok)}.blank.wrong{border-color:#ff7190;background:var(--bad-bg);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:9px}.word{border:2px solid var(--line);background:var(--soft);color:var(--purple);border-radius:12px;padding:8px 12px;font:700 13px 'Poppins',sans-serif;cursor:pointer}.word.used{opacity:.35;text-decoration:line-through}
.inst{padding:12px 14px;border-radius:14px;background:var(--soft);font-weight:600;font-size:14px;line-height:1.6;margin-bottom:14px}
.bar{background:var(--line);height:9px;border-radius:99px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7758e8,#ff75ae);transition:width .3s}
.res{display:none;margin-top:16px;padding:16px;border-radius:14px;background:var(--soft);font-weight:600;line-height:1.8}
.code{width:100%;font-size:11px;min-height:60px;margin-top:6px}
.msg{font-size:12px;font-weight:600;color:var(--green);margin-left:6px}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
/* HALLOWEEN */
.wrap,.ground{position:relative;z-index:1}.hero{position:relative}
:root:not(.plain):not([data-theme="light"]){color-scheme:dark;--bg:#160d2b;--card:#241540;--ink:#fff1de;--mut:#c3a9e8;--line:#4b2f7a;--soft:#34205c;--purple:#ff8a1f;--pink:#b86bff;--green:#3ddc97;--ok-bg:#123b2e;--ok:#6ff0b8;--bad-bg:#47203a;--bad:#ff8fa8;--field:#1b1033}
html:not(.plain) body{background:radial-gradient(circle at 12% 0%,#6b2bb066,transparent 45%),radial-gradient(circle at 92% 100%,#ff7a0040,transparent 42%),#160d2b}
html:not(.plain) .hero{background:linear-gradient(120deg,#ff7a00,#d4470a 45%,#5b21b6);box-shadow:0 10px 30px #ff7a0040}
html:not(.plain) .btn.p{background:linear-gradient(100deg,#ff7a00,#ff4d2e);color:#fff}
html:not(.plain) .bar i{background:linear-gradient(90deg,#ff8a1f,#b86bff)}
html:not(.plain) .card{border-color:#5a3a92;position:relative}
html:not(.plain) .card:nth-of-type(3n+1)::before{content:"";position:absolute;top:0;right:52px;width:2px;height:30px;background:#cdbbf0aa;pointer-events:none}
html:not(.plain) .card:nth-of-type(3n+1)::after{content:"🕷️";position:absolute;top:26px;right:41px;font-size:24px;pointer-events:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.spd{position:absolute;top:100%;margin-top:-1px;transform-origin:top center;animation:sw 3s ease-in-out infinite alternate;z-index:2;pointer-events:none}
.spd i{display:block;width:2px;height:var(--h);background:#e5d9ff;margin:0 auto}.spd b{display:block;font-size:28px;margin-top:-6px;line-height:1}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.hl,.hr{position:absolute;bottom:6px;font-size:clamp(34px,7vw,64px);line-height:1;animation:fl 3s ease-in-out infinite}.hl{left:2.5%}.hr{right:2.5%;animation-delay:-1.5s}
@media(max-width:560px){.hl,.hr{display:none}}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx .fl{position:absolute;opacity:.55;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(6deg)}}
.fx .bat{position:absolute;left:0;font-size:28px;z-index:2;animation:fly linear infinite;opacity:.9}
@keyframes fly{from{transform:translateX(-12vw) translateY(0)}50%{transform:translateX(50vw) translateY(-26px)}to{transform:translateX(112vw) translateY(0)}}
.ground{text-align:center;font-size:clamp(26px,5vw,40px);margin-top:34px;padding-bottom:16px}
.ground span{display:inline-block;margin:0 clamp(2px,1vw,10px);animation:jump 2.2s ease-in-out infinite}
@keyframes jump{0%,70%,100%{transform:translateY(0)}85%{transform:translateY(-12px)}}
.tg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;font-size:18px;padding:8px 12px}
html.plain .spd,html.plain .hl,html.plain .hr,html.plain .fx,html.plain .ground{display:none}
.em{font-size:1.9em;line-height:1;vertical-align:-.12em;display:inline-block}
.word.x{opacity:.35;text-decoration:line-through}
.qh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip2{background:var(--soft);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px}
.qbar{height:10px;border-radius:99px;background:var(--line);margin:12px 0 26px;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a1f,#b86bff);transition:width .5s}
.qcard{position:relative;background:linear-gradient(160deg,var(--card),var(--soft));border:2px solid var(--line);border-radius:26px;padding:22px 18px 26px;box-shadow:0 16px 40px #0006;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}}
.qtimer{position:absolute;right:14px;top:-24px;width:64px;height:64px;filter:drop-shadow(0 0 10px #ff8a1f88)}
.qtimer svg{width:100%;height:100%;transform:rotate(-90deg)}.qtimer circle{fill:var(--card);stroke-width:4}.qtimer .tr{stroke:var(--line)}.qtimer .tp{stroke:#ff8a1f;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;transition:stroke .3s}
.qtimer b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.qtimer.low .tp{stroke:#ff4d6d}.qtimer.low{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.qtxt{font-size:clamp(20px,4.2vw,30px);font-weight:800;line-height:1.35;margin:14px 70px 14px 0}
.qimg{display:block;max-width:100%;max-height:300px;margin:6px auto 14px;border-radius:18px;border:2px solid var(--line);animation:pop .5s}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}@media(max-width:600px){.qopts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:none;border-radius:18px;color:#fff;font:700 clamp(15px,3.4vw,19px) 'Poppins',sans-serif;cursor:pointer;transition:transform .18s,filter .2s;box-shadow:0 6px 0 #0004;animation:pop .5s backwards}
.opt:nth-child(1){background:linear-gradient(135deg,#ff8a1f,#ff5a1f);animation-delay:.05s}.opt:nth-child(2){background:linear-gradient(135deg,#8b5cf6,#6d28d9);animation-delay:.12s}.opt:nth-child(3){background:linear-gradient(135deg,#10b981,#047857);animation-delay:.19s}.opt:nth-child(4){background:linear-gradient(135deg,#ec4899,#be185d);animation-delay:.26s}.opt:nth-child(n+5){background:linear-gradient(135deg,#0ea5e9,#0369a1)}
.opt:hover{transform:translateY(-3px) scale(1.02);filter:brightness(1.1)}.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.opt .ol{flex:none;width:38px;height:38px;border-radius:12px;background:#0003;display:grid;place-items:center;font-size:20px}
.opt img{max-height:100px;max-width:100%;border-radius:12px;margin-top:6px}
.opt.sel{outline:4px solid #fff;transform:scale(1.03)}
.opt.good{background:linear-gradient(135deg,#22c55e,#15803d)!important;outline:4px solid #bbf7d0;animation:glow .8s ease-out}
.opt.bad{background:linear-gradient(135deg,#ef4444,#991b1b)!important;animation:shake .5s}
.opt.dim{opacity:.4;filter:grayscale(.5)}.opt:disabled{cursor:default}.opt:disabled:hover{transform:none}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes glow{from{box-shadow:0 0 0 0 #4ade80}to{box-shadow:0 0 0 24px #4ade8000}}
.oin{width:100%;padding:16px;border-radius:16px;border:3px solid var(--line);background:var(--field);color:var(--ink);font:700 20px 'Poppins',sans-serif;outline:none;text-align:center;margin-bottom:12px}.oin:focus{border-color:#ff8a1f;box-shadow:0 0 0 5px #ff8a1f33}
.fbk{margin-top:16px;padding:14px 16px;border-radius:16px;font-weight:700;line-height:1.6;animation:pop .4s}.fbk.ok{background:var(--ok-bg);color:var(--ok)}.fbk.no{background:var(--bad-bg);color:var(--bad)}
.pts{display:inline-block;font-size:1.4em;font-weight:800;animation:pop .6s}
.cf{position:fixed;top:-50px;z-index:60;pointer-events:none;animation:cfall var(--d) ease-in forwards}@keyframes cfall{to{transform:translate(var(--x),112vh) rotate(540deg)}}
.sbig{font-size:clamp(54px,15vw,100px);font-weight:800;line-height:1.1;background:linear-gradient(90deg,#ff8a1f,#ffd166,#b86bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.dropOn{outline:3px dashed var(--purple);outline-offset:2px;background:var(--soft)}
.fab{display:none;position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;font-size:15px;padding:12px 18px;border-radius:99px;box-shadow:0 6px 18px #0008}
@media(max-width:900px){.fab{display:block}}
.sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:3px solid var(--purple);border-radius:22px 22px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:55vh;overflow:auto;box-shadow:0 -10px 30px #000a}
.sheet.on{display:block;animation:pop .3s}.sheeth{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:70;background:linear-gradient(100deg,#ff7a00,#b86bff);color:#fff;font-weight:700;padding:12px 20px;border-radius:99px;box-shadow:0 8px 24px #000a;animation:pop .4s;max-width:90vw}
.cw{position:fixed;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30}.cwb{opacity:.55;font-size:16px;padding:8px 12px;border-radius:99px}.cw.on .cwb{opacity:1}
.cwp{display:none;position:absolute;right:0;bottom:46px;width:min(320px,86vw);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 30px #000a}.cw.on .cwp{display:block;animation:pop .25s}
.mo{position:fixed;inset:0;z-index:90;background:#000b;display:grid;place-items:center;animation:pop .2s}
.mob{width:min(420px,90vw);background:var(--card);border:2px solid var(--purple);border-radius:22px;padding:22px;box-shadow:0 20px 60px #000c;animation:pop .3s}
.note{padding:10px 14px;border-radius:14px;background:#3b2a73;border:2px dashed #b86bff;color:#efe4ff;font-weight:700;font-size:14px;margin:6px 0 12px;line-height:1.5}
.fbk.info{background:var(--soft);color:var(--ink)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}@media(max-width:560px){.mt{grid-template-columns:1fr}}
.mrow,.mchip{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:10px;padding:12px;border-radius:16px;border:3px solid var(--line);color:var(--ink);font:700 15px 'Poppins',sans-serif;cursor:pointer;text-align:left;transition:.2s;animation:pop .4s backwards}
.mrow{background:var(--soft)}.mchip{background:linear-gradient(135deg,#34205c,#241540)}
.mb{flex:none;width:30px;height:30px;border-radius:10px;background:var(--c,#555);color:#fff;display:grid;place-items:center;font-size:14px}
.mrow .ms{margin-left:auto;padding:4px 10px;border-radius:10px;background:var(--field);font-weight:800;color:var(--c);min-width:56px;text-align:center}
.mrow.sel{border-color:var(--c);box-shadow:0 0 0 4px #fff3;transform:scale(1.02)}.mrow.pair{border-color:var(--c)}
.mchip .mb{opacity:0}.mchip.used{border-color:var(--c)}.mchip.used .mb{opacity:1}.mchip.sel{border-color:#fff;transform:scale(1.03)}
.mrow.good{border-color:#22c55e;background:var(--ok-bg)}.mrow.bad{border-color:#ef4444;background:var(--bad-bg);animation:shake .5s}
.shk{animation:shake .4s}
.dlg{display:flex;flex-direction:column;gap:12px;margin:12px 0;line-height:1.6}
.dn{text-align:center;color:var(--mut);font-size:13px;font-style:italic}
.db{display:flex;gap:10px;align-items:flex-end;animation:pop .45s backwards;max-width:92%}.db.r{flex-direction:row-reverse;margin-left:auto}
.da{flex:none;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 10px #0005}
.dbb{background:var(--soft);border:2px solid var(--c);border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:600}.db.r .dbb{border-radius:18px 18px 4px 18px}
.dbb b{display:block;font-size:12px;color:var(--c);margin-bottom:2px}
.fcw{perspective:1000px;display:grid;place-items:center;margin:16px 0}
.fc{position:relative;width:min(340px,88vw);height:min(260px,48vh);touch-action:pan-y;cursor:grab;user-select:none}
.fci{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.3,1.1)}.fc.flip .fci{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;border:3px solid var(--purple);box-shadow:0 16px 40px #0007}
.fcf{background:linear-gradient(160deg,var(--card),var(--soft))}.fcb{background:linear-gradient(160deg,#ff8a1f,#b86bff);color:#fff;transform:rotateY(180deg);border-color:#fff3}
.fct{font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1.2}.fcf small,.fcb small{opacity:.7;font-weight:700}
.fcg{position:absolute;top:14px;padding:6px 14px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;z-index:2;border:3px solid}.g1{right:14px;color:#22c55e;border-color:#22c55e;transform:rotate(8deg)}.g2{left:14px;color:#ef4444;border-color:#ef4444;transform:rotate(-8deg)}
.gds{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.gd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--soft);border:2px solid var(--line);color:var(--mut)}.gd.ok{background:#22c55e;border-color:#22c55e;color:#fff}.gd.cur{border-color:#ff8a1f;color:#ff8a1f;animation:pulse .8s ease-in-out infinite alternate}
.ph{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}.ph span{padding:6px 14px;border-radius:99px;background:var(--soft);font-weight:700;font-size:13px;color:var(--mut)}.ph span.on{background:linear-gradient(100deg,#ff7a00,#b86bff);color:#fff}
.flag{display:inline-block;width:1.3em;height:.9em;background:linear-gradient(#fff 50%,#dc143c 50%);border:1px solid #0004;border-radius:2px;vertical-align:-.12em;box-shadow:0 2px 4px #0003}
.spd.pl,.hl.pl,.hr.pl,.hem .pl{display:none}
html.pl .spd.pl{display:block}html.pl .hl.pl,html.pl .hr.pl{display:block}html.pl .hem .pl{display:inline}
html.pl .spd.hw,html.pl .hl.hw,html.pl .hr.hw,html.pl .hem .hw{display:none}
@media(max-width:560px){html.pl .hl.pl,html.pl .hr.pl{display:none}}
.hem{font-size:38px}
:root.pl:not(.plain):not([data-theme="light"]){color-scheme:dark;--bg:#1d0b10;--card:#2b1219;--ink:#fff3f5;--mut:#d6a6af;--line:#4d2531;--soft:#3b1b25;--purple:#e8284a;--pink:#ff6b81;--green:#3ddc97;--ok-bg:#123b2e;--ok:#6ff0b8;--bad-bg:#47203a;--bad:#ff8fa8;--field:#230e14}

function student(ex){if(ex.k==="q")return quiz(ex);if(ex.k==="v")return vocab(ex);if(ex.k==="c")return cwPlay(ex);
  const bankWords=[];
  const parts=[];let last=0,n=0;
  ex.x.replace(GAP,(m,a,i)=>{parts.push(big(esc(ex.x.slice(last,i))).replace(/\n/g,"<br>"));
    const ans=a.split("|").map(s=>s.trim()).filter(Boolean);bankWords.push(ans[0]);
    parts.push(`<input class="blank" data-a="${esc(ans.join("|"))}" aria-label="Luka ${++n}" autocomplete="off" autocapitalize="off" spellcheck="false">`);last=i+m.length;return m});
  parts.push(big(esc(ex.x.slice(last))).replace(/\n/g,"<br>"));
  const words=ex.b?(ex.bw!=null?ex.bw.split(","):[...bankWords,...(ex.e||"").split(",")]).map(s=>s.trim()).filter(Boolean).sort(()=>Math.random()-.5):[];
  app.innerHTML=hdr(esc(ex.t||"Ćwiczenie"),"Uzupełnij luki i kliknij „Sprawdź”. Masz tylko jedną próbę!")+
  (ex.n?`<section class="card big"><div class="pol">📌 Polecenie</div><div class="polt">${esc(ex.n)}</div></section>`:"")+
  (words.length?`<section class="card"><h2>🎨 Bank słów</h2><div class="bank" id="bank"></div><div class="row"><button class="btn" id="stk" type="button">✏️ Skreślanie słów: wyłączone</button></div><div class="hint">Kliknij słowo, a potem lukę, albo wpisz odpowiedź ręcznie. Włącz skreślanie, żeby ręcznie zaznaczać słowa, które już zrobiłeś (na komputerze działa też prawy przycisk myszy).</div></section>`:"")+
  `<section class="card">
  <label style="margin-top:0">Twoje imię i nazwisko</label><input type="text" id="sname" placeholder="np. Anna Kowalska" style="max-width:320px;margin-bottom:14px">
  <div class="lay${(ex.im||[]).length?" has":""}">${(ex.im||[]).length?`<div class="pics">${(ex.im||[]).map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div>`:""}<div class="story">${ex.dlg?dlgHTML(parts.join("").split("<br>")):parts.join("")}</div></div><div class="bar"><i id="bar"></i></div>
  <div class="row"><button class="btn p" id="chk">✅ Sprawdź (tylko raz)</button></div>
  <div class="res" id="res"></div></section>${words.length?`<button class="btn p fab" id="fab" type="button">📚 Słowa</button><div class="sheet" id="sheet"><div class="sheeth"><b>📚 Bank słów</b><button class="btn" id="shx" type="button">✕ Zamknij</button></div><div class="bank" id="sbank"></div><div class="hint">Kliknij słowo, żeby wstawić je do luki. Skreślanie działa tak samo jak w banku.</div></div>`:''}`;
  const blanks=[...document.querySelectorAll(".blank")];let sel=null,lastIn=null;let saved=null;if(!ex.p){try{saved=JSON.parse(localStorage.getItem("luki_done_"+ex.i))}catch(e){}}
  const bank=$("#bank");let strike=false;const sb=$("#stk");if(sb)sb.onclick=()=>{strike=!strike;sb.textContent="✏️ Skreślanie słów: "+(strike?"włączone, klikaj słowa":"wyłączone");sb.style.background=strike?"var(--purple)":"";sb.style.color=strike?"#fff":""};
  const upd=()=>{const u=new Set(blanks.map(b=>norm(b.value)));document.querySelectorAll(".word").forEach(w=>w.classList.toggle("used",u.has(norm(w.textContent))))};
  words.forEach(w=>{const b=document.createElement("button");b.className="word";b.type="button";b.textContent=w;
    b.oncontextmenu=ev=>{ev.preventDefault();b.classList.toggle("x")};b.onclick=()=>{if(strike){b.classList.toggle("x");return}const t=document.activeElement.classList&&document.activeElement.classList.contains("blank")?document.activeElement:(lastIn&&!lastIn.value?lastIn:blanks.find(x=>!x.value));
      if(t){t.value=w;t.classList.remove("correct","wrong");t.focus();upd()}};bank.appendChild(b)});
  const sbk=$("#sbank");if(sbk&&bank){[...bank.children].forEach(wb=>{const c=document.createElement("button");c.type="button";c.className="word";c.textContent=wb.textContent;c.onclick=()=>{wb.click();syncS()};sbk.appendChild(c)});
    const syncS=()=>[...bank.children].forEach((wb,i)=>{if(sbk.children[i])sbk.children[i].className=wb.className});new MutationObserver(syncS).observe(bank,{subtree:true,attributes:true,attributeFilter:["class"]});
    $("#fab").onclick=()=>$("#sheet").classList.toggle("on");$("#shx").onclick=()=>$("#sheet").classList.remove("on")}
  blanks.forEach(b=>{b.addEventListener("focus",()=>lastIn=b);b.addEventListener("input",()=>{b.classList.remove("correct","wrong");upd()});
    b.addEventListener("click",()=>{if(sel&&!b.value){}})});
  $("#chk").onclick=()=>{
    const name=$("#sname").value.trim();
    if(!name){$("#sname").focus();$("#sname").style.borderColor="#ff7190";return}
    if(!saved&&!ex.p&&!confirm("Możesz sprawdzić odpowiedzi tylko jeden raz. Czy na pewno chcesz sprawdzić?"))return;
    let ok=0;const det=[];blanks.forEach(b=>{const good=b.dataset.a.split("|").map(norm).includes(norm(b.value));b.classList.remove("correct","wrong");b.classList.add(good?"correct":"wrong");det.push([b.value,good?1:0]);if(good)ok++});
    const t=blanks.length;$("#bar").style.width=(t?ok/t*100:0)+"%";
    const code=saved?saved.code:enc({i:ex.i,n:name,c:ok,t:t,d:new Date().toISOString(),a:det});
    if(!saved&&!ex.p)notifyT(ex,name,ok,t);
    if(ex.fb&&!saved&&!ex.p){fbReq(ex.fb,"/res/"+ex.i,"POST",{n:name,c:ok,t:t,d:new Date().toISOString(),a:det}).then(()=>{const s=$("#sent");if(s)s.textContent="✔ Wynik został wysłany do nauczyciela automatycznie."},()=>{const s=$("#sent");if(s){s.style.color="var(--bad)";s.textContent="Nie udało się wysłać wyniku automatycznie. Kliknij 🔑 w prawym dolnym rogu, skopiuj kod i wyślij go nauczycielowi."}cwOpen()})}
    if(!ex.p){blanks.forEach(b=>b.readOnly=true);document.querySelectorAll(".word").forEach(w=>w.disabled=true);$("#sname").readOnly=true;$("#chk").style.display="none";
      try{localStorage.setItem("luki_done_"+ex.i,JSON.stringify({code:code,ans:blanks.map(b=>b.value),name:name}))}catch(e){}}
    const r=$("#res");r.style.display="block";
    r.innerHTML=`${ok===t?"🏆 Perfekcyjnie!":"⭐ Twój wynik:"} <span style="color:var(--ok)">✔ ${ok} dobrze</span> · <span style="color:var(--bad)">✘ ${t-ok} źle</span> (${ok}/${t})
    <div class="hint">Zielone luki są poprawne, czerwone błędne. To była jedyna próba.</div>
    <div id="sent" class="msg" style="display:block;margin:8px 0 0">${ex.p?"":ex.fb?"Wysyłam wynik do nauczyciela…":"Wyślij nauczycielowi kod wyniku: kliknij 🔑 w prawym dolnym rogu."}</div>`;
    cwShow(code,!ex.fb&&!ex.p);
  };
  if(saved){$("#sname").value=saved.name;blanks.forEach((b,i)=>b.value=saved.ans[i]||"");upd();$("#chk").onclick()}
}

let S={folders:[],ex:[],res:[]},curF="all",curE=null,tab="edit",dbDoc=null,note="",openD={};
const normS=d=>{const o=Object.assign({folders:[],ex:[],res:[],del:[]},d);["folders","ex","res","del"].forEach(k=>{o[k]=o[k]?(Array.isArray(o[k])?o[k]:Object.values(o[k])):[]});
  o.ex.forEach(x=>{if(x.qs){x.qs=Array.isArray(x.qs)?x.qs:Object.values(x.qs);x.qs.forEach(q=>{if(q.o)q.o=Array.isArray(q.o)?q.o:Object.values(q.o);if(q.pr)q.pr=Array.isArray(q.pr)?q.pr:Object.values(q.pr)})}if(x.images&&!Array.isArray(x.images))x.images=Object.values(x.images);if(x.words){x.words=Array.isArray(x.words)?x.words:Object.values(x.words)}if(x.cw){x.cw=Array.isArray(x.cw)?x.cw:Object.values(x.cw)}if(x.cwl&&x.cwl.p&&!Array.isArray(x.cwl.p))x.cwl.p=Object.values(x.cwl.p).map(v=>Object.values(v))});return o};
async function pkey(){const t=fbHost(S.fb)+"|"+pcode;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent(t))).replace(/\W/g,"")}}
const cwHTML=code=>`<div class="cw" id="cw"><button class="btn cwb" id="cwb" type="button" title="Kod wyniku (zapasowy)">🔑</button><div class="cwp"><div class="hint" style="margin:0 0 6px">Kod wyniku (zapasowy). Zwykle niepotrzebny, bo wynik wysyła się sam.</div><textarea class="code" readonly onclick="this.select()">${code}</textarea><div class="row"><button class="btn g" id="cp" type="button">📋 Kopiuj kod</button><span class="msg" id="cm"></span></div></div></div>`;
const cwShow=(code,open)=>{const o=document.getElementById('cw');if(o)o.remove();document.body.insertAdjacentHTML('beforeend',cwHTML(code));const c=$('#cw');if(open)c.classList.add('on');$('#cwb').onclick=()=>c.classList.toggle('on');
  $('#cp').onclick=()=>{const ta=c.querySelector('textarea');ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand('copy')}$('#cm').textContent='Skopiowano!'}};

const w3Send=(key,subject,message)=>fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:key,subject:subject,from_name:'Ćwiczenia z lukami',message:message})});
function notifyT(ex,name,c,t){if(ex.p)return;const body=name+' skończył(a): '+(ex.t||'ćwiczenie')+'\nWynik: '+c+'/'+t+' ('+(t?Math.round(c/t*100):0)+'%)';
  if(ex.w3)try{w3Send(ex.w3,'Nowy wynik: '+name+' ('+(ex.t||'')+')',body).catch(()=>{})}catch(e){}}
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),7000)};
async function pollRes(){const h=fbHost(S.fb);if(!h||!panelOn||document.hidden)return;let add=0;const names=[];
  for(const e of S.ex.slice(0,20)){try{const d=await fbReq(h,'/res/'+e.id,'GET');if(d)Object.entries(d).forEach(([k,v])=>{const id='fb'+k;if(v&&v.n&&!S.res.some(r=>r.id===id)&&!(S.del||[]).includes(id)){S.res.push({id,ex:e.id,n:String(v.n),c:+v.c||0,t:+v.t||0,d:v.d||new Date().toISOString(),a:v.a});add++;names.push(v.n)}})}catch(x){}}
  if(add){save();toast('🔔 Nowe wyniki: '+names.slice(0,3).join(', ')+(names.length>3?'…':''));try{if(window.Notification&&Notification.permission==='granted')new Notification('Nowy wynik ucznia',{body:names.join(', ')})}catch(x){}
    document.title='('+add+') Ćwiczenia z lukami';const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea,select')))teacher()}}
window.__poll=pollRes;
async function cloudPush(){const h=fbHost(S.fb);if(!h||!pcode)return;try{await fbReq(h,"/panel/"+await pkey(),"PUT",S);cloudErr=""}catch(e){cloudErr=String((e&&e.message)||e)}}
async function cloudPull(force){const h=fbHost(S.fb);if(!h||!pcode)return false;
  try{const d=await fbReq(h,"/panel/"+await pkey(),"GET");cloudErr="";if(d&&(force||(d.upd||0)>(S.upd||0))){const keep=S.fb;S=normS(d);S.fb=S.fb||keep;try{localStorage.setItem("luki_state",JSON.stringify(S))}catch(e){}return true}}catch(e){cloudErr=String((e&&e.message)||e)}return false}

const b64u=u=>{let s="";u.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const pipe=async(u,C)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new C("deflate-raw"))).arrayBuffer());
const encz=async o=>{try{return "~"+b64u(await pipe(new TextEncoder().encode(JSON.stringify(o)),CompressionStream))}catch(e){return enc(o)}};
const decz=async s=>s[0]==="~"?JSON.parse(new TextDecoder().decode(await pipe(unb(s.slice(1)),DecompressionStream))):dec(s);
const small=u=>new Promise(r=>{if(!u.startsWith("data:")||u.length<9000)return r(u);const im=new Image();im.onerror=()=>r(u);im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let o=c.toDataURL("image/webp",.4);if(!o.startsWith("data:image/webp"))o=c.toDataURL("image/jpeg",.4);r(o.length<u.length?o:u)};im.src=u});
let fbErr="";
const fbHost=h=>String(h||"").trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"");
async function fbReq(host,path,method,body){const ac=new AbortController();const to=setTimeout(()=>ac.abort(),9000);try{const r=await fetch("https://"+host+path+".json",{method,headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined,signal:ac.signal});if(!r.ok)throw new Error("błąd "+r.status);return await r.json()}finally{clearTimeout(to)}}
async function link(e,mode,vm){const base=location.href.split("#")[0];const lk=vm?"lid_"+vm:"lid";const mk=(im,inl)=>{const o=mk1(im,inl);if(S.w3)o.w3=S.w3;return o};const mk1=(im,inl)=>{if(e.kind==="cw")return cwObj(e);if(e.kind==="vocab")return vObj(e,vm);if(e.kind==="quiz")return qObj(e,inl);const o={i:e.id,t:e.title,n:e.inst,x:e.text,b:e.bank};if(e.dlg)o.dlg=1;if(e.bw!=null)o.bw=e.bw;else if(e.extra)o.e=e.extra;if(im.length)o.im=im;return o};
  const inl=base+"#u="+await encz(mk(await Promise.all((e.images||[]).map(small)),true));
  fbErr="";const h=fbHost(S.fb);if(!h)return inl;
  try{const id=(mode!=="new"&&e.lh===h&&e[lk])?e[lk]:uid()+uid();await fbReq(h,"/ex/"+id,"PUT",mk(e.images||[]));e[lk]=id;e.lh=h;save();return base+"#k="+h+"/"+id}catch(x){fbErr=String((x&&x.message)||x)}
  return inl}
function gaps(text){text=text||"";const a=[];text.replace(GAP,(m,x)=>{a.push(x);return m});return a}

const kids=pid=>S.folders.filter(f=>(f.parent||'')===(pid||''));
const fpath=id=>{const a=[];let c=S.folders.find(f=>f.id===id),g=0;while(c&&g++<30){a.unshift(c);c=S.folders.find(f=>f.id===c.parent)}return a};
const cntIn=id=>{const ids=new Set([id]);const walk=p=>kids(p).forEach(k=>{ids.add(k.id);walk(k.id)});walk(id);return S.ex.filter(x=>ids.has(x.folder)).length};
const isDesc=(t,fid)=>{let c=t,g=0;while(c&&g++<30){if(c===fid)return true;const f=S.folders.find(z=>z.id===c);c=f?f.parent:''}return false};
const ensureOpen=id=>{S.fe=S.fe||{};fpath(id).slice(0,-1).forEach(f=>S.fe[f.id]=true)};
const folderOpts=sel=>{const out=['<option value="">— brak —</option>'];const walk=(p,d)=>kids(p).forEach(f=>{out.push(`<option value="${f.id}" ${sel===f.id?'selected':''}>${'\u00a0\u00a0'.repeat(d)}${d?'↳ ':''}${esc(f.name)}</option>`);walk(f.id,d+1)});walk('',0);return out.join('')};
const tree=(pid,d)=>kids(pid).map(f=>{const k=kids(f.id).length,op=S.fe&&S.fe[f.id];return `<div class="fn"><div class="item ft ${curF===f.id?'on':''}" data-f="${f.id}" data-dz="${f.id}" draggable="true" style="padding-left:${8+d*16}px"><span class="tg2" data-tg="${f.id}">${k?(op?'▾':'▸'):'·'}</span><span class="fi">${op&&k?'📂':'📁'}</span><span class="fnm">${esc(f.name)}</span><small>${cntIn(f.id)}</small></div>${op&&k?tree(f.id,d+1):''}</div>`}).join('');
function listHTML(){const q=srch.trim().toLowerCase();
  const ico=x=>x.kind==='quiz'?'🎯':x.kind==='vocab'?'📚':x.kind==='cw'?'🧩':'📝';
  const meta=x=>x.kind==='quiz'?((x.qs||[]).length+' pytań'):x.kind==='vocab'?((x.words||[]).filter(w=>w[0]&&w[1]).length+' słówek'):x.kind==='cw'?((x.cw||[]).length+' haseł'):(gaps(x.text).length+' luk');
  let subs='',items;
  if(q)items=S.ex.filter(x=>(x.title||'').toLowerCase().includes(q));
  else if(curF==='all')items=S.ex;
  else{subs=kids(curF).map(f=>`<div class="tile" data-f="${f.id}" data-dz="${f.id}"><span class="ti">📁</span><div><b>${esc(f.name)}</b><small>${cntIn(f.id)} elementów</small></div></div>`).join('');items=S.ex.filter(x=>x.folder===curF)}
  return subs+items.map(x=>`<div class="tile ${curE===x.id?'on':''}" data-e="${x.id}" draggable="true"><span class="ti">${ico(x)}</span><div><b>${esc(x.title||'Bez tytułu')}</b><small>${meta(x)}${x.folder&&(q||curF==='all')?' · 📁 '+esc((S.folders.find(f=>f.id===x.folder)||{}).name||''):''}</small></div></div>`).join('')||(subs?'':'<div class="empty">Pusto. Dodaj ćwiczenie poniżej.</div>')}

/* ---------- CROSSWORD ---------- */
const cwFold=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Ł/g,'L');
const cwClean=a=>String(a||'').toUpperCase().replace(/[\s\-'’.,!?]/g,'');
function cwRng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function cwBuild(words,seed){let best=null;const T0=performance.now();
  for(let t=0;t<70;t++){if(best&&performance.now()-T0>250)break;const rnd=cwRng(seed*131+t*7919+1);
    const order=words.map((w,i)=>i).filter(i=>words[i].length>1).sort((a,b)=>words[b].length-words[a].length||rnd()-0.5);
    for(let k=2;k<order.length;k++)if(rnd()<0.35){const x=order[k];order[k]=order[k-1];order[k-1]=x}
    if(!order.length)continue;
    const grid=new Map(),placed=[],un=[];const key=(r,c)=>r+','+c;
    const canPlace=(w,r,c,d)=>{const dr=d==='D'?1:0,dc=d==='A'?1:0;let inter=0;
      if(grid.has(key(r-dr,c-dc))||grid.has(key(r+dr*w.length,c+dc*w.length)))return -1;
      for(let k=0;k<w.length;k++){const rr=r+dr*k,cc=c+dc*k,g=grid.get(key(rr,cc));
        if(g){if(g.ch!==w[k]||g.d.includes(d))return -1;inter++}
        else if(d==='A'){if(grid.has(key(rr-1,cc))||grid.has(key(rr+1,cc)))return -1}
        else if(grid.has(key(rr,cc-1))||grid.has(key(rr,cc+1)))return -1}

    const hn=$('#cwhn');if(hn)hn.onclick=()=>{const w=L.words[act],ks=keysOf(w);const k=ks.find((kk,ix)=>cwFold(inp(kk).value)!==cwFold(w.ans[ix]));if(k){inp(k).value=w.ans[ks.indexOf(k)];hints++;startT();evaluate(false);persist()}};
    $('#cwcl').onclick=()=>{const w=L.words[act];keysOf(w).forEach((k,ix)=>{if(!(L.cells.get(k).ws.some(x=>x!==act&&prev[x]===1)))inp(k).value=''});evaluate(false);persist()};
    const mx=$('#cwmix');if(mx)mx.onclick=()=>{mx.disabled=true;mx.textContent='Mieszam…';setTimeout(()=>ex.sh(),40)};
    $('#cwfin').onclick=async()=>{const solved=evaluate(true);const ok=ex.p?true:await modal({title:'✅ Zakończyć krzyżówkę?',text:`Rozwiązane hasła: ${solved} z ${N}. Po wysłaniu nie da się już poprawiać.`,ok:'Zakończ i wyślij'});if(ok)finish()};
    if(!ex.p){let st=null;try{st=JSON.parse(localStorage.getItem(pk))}catch(e){}if(st){Object.entries(st.v||{}).forEach(([k,v])=>{const i=inp(k);if(i)i.value=v});el0=st.el||0;hints=st.h||0;const t=$('#cwt');if(t)t.textContent=fmt2(el0)}}
    evaluate(true);act=0;dir=L.words[0].d;paint('');
    ca.querySelectorAll('.cwli img').forEach(im=>{im.dataset.z='1'})}
  function intro(){ca.innerHTML=`${ex.n?`<section class="card big"><div class="pol">📌 Polecenie</div><div class="polt">${esc(ex.n)}</div></section>`:''}<section class="card"><div class="row" style="margin:0"><span class="chip2">🧩 ${N} haseł</span><span class="chip2">📐 ${L.C}×${L.R}</span></div><label>Twoje imię i nazwisko</label><input type="text" id="qn" placeholder="np. Anna Kowalska" style="max-width:340px"><div class="row"><button class="btn p" id="go" style="font-size:18px;padding:14px 30px">▶ Start</button></div><div class="hint">Wynik wyślesz na końcu. Masz jedną próbę, ale możesz poprawiać litery do zakończenia.</div></section>`;
    $('#go').onclick=async()=>{const v=$('#qn').value.trim();if(!v){$('#qn').focus();$('#qn').style.borderColor='#ff7190';return}name=v;
      if(ex.fb&&!ex.p){const g=$('#go');g.disabled=true;g.textContent='Sprawdzam…';try{const d=await fbReq(ex.fb,'/res/'+ex.i,'GET');const mine=Object.values(d||{}).find(r=>r&&r.n&&norm(r.n)===norm(v));
        if(mine){end(mine.n,+mine.c||0,mine.a?Object.values(mine.a):[],'','Ta osoba już rozwiązała tę krzyżówkę. To wynik z pierwszej próby.',null);return}}catch(e){}}
      beep('ok');play()}}
  if(!N){ca.innerHTML='<section class="card">Ta krzyżówka nie ma jeszcze układu.</section>';return}
  if(saved&&saved.cw)end(saved.name,saved.score,saved.log||[],saved.code,'Ta krzyżówka została już rozwiązana. Oto twój wynik.',saved.tm);
  else if(ex.p)play();else intro()}

async function init(){
  const m=location.hash.match(/^#u=(.+)$/);
  const bm=location.hash.match(/^#k=([\w.-]+)\/([\w-]+)$/);
  if(bm){app.innerHTML=hdr("Ładowanie…","Chwileczkę");
    try{const o=await fbReq(bm[1],"/ex/"+bm[2],"GET");if(!o)throw 0;o.fb=bm[1];student(o);return}
    catch(e){app.innerHTML=hdr("Ups","Nie udało się wczytać ćwiczenia")+`<div class="card">Sprawdź internet i spróbuj ponownie. Jeśli to nie pomoże, poproś nauczyciela o nowy link.</div>`;return}}
  if(m){try{student(await decz(m[1]));return}catch(e){app.innerHTML=hdr("Ups","Ten link jest uszkodzony")+`<div class="card">Poproś nauczyciela o nowy link.</div>`;return}}
  let owner=true;
  try{const u=await cap("user");if(u)owner=await u.isOwner()}catch(e){}
  if(!owner){app.innerHTML=hdr("Ćwiczenia z lukami","Otwórz link otrzymany od nauczyciela")+`<div class="card">Ta strona to panel nauczyciela. Uczeń otwiera ćwiczenie przez swój link.</div>`;return}
  await load();if(!S.fb&&openD.fb===undefined)openD.fb=true;teacher();panelOn=true;
  cloudPull(false).then(ch=>{if(ch)teacher()});
  setInterval(pollRes,60000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.title='Ćwiczenia z lukami'});
document.addEventListener("visibilitychange",()=>{if(document.hidden||!panelOn||!S.fb||!pcode)return;const a=document.activeElement;if(a&&a.matches&&a.matches("input,textarea,select"))return;cloudPull(false).then(ch=>{if(ch)teacher()})});
window.addEventListener("hashchange",()=>location.reload());
(function(){const R=document.documentElement;let th='pl';try{const t=localStorage.getItem('luki_theme');if(t)th=t;else if(localStorage.getItem('luki_plain')==='1')th='plain'}catch(e){}
  const fx=$("#fx");
  const HW=[["🎃",2,12,44],["👻",92,16,40],["🧙",90,44,46],["💀",3,64,40],["🕸️",0,0,70],["🕸️",93,0,70],["🎃",92,72,46],["🍬",6,88,30],["🧛",86,88,42],["🕯️",2,40,30],["🧟",94,58,40],["👻",8,26,34],["🌕",80,4,46],["🦉",96,30,34],["🦴",5,78,30]];
  const PL=[["FLAG",2,12,36],["🦅",92,16,46],["🎆",90,44,48],["🎇",3,64,44],["FLAG",93,72,34],["❤️",6,88,30],["🤍",86,88,34],["🕯️",2,40,30],["🎖️",94,58,36],["🏛️",8,26,34],["🎆",80,4,46],["🌹",96,30,34],["🎇",5,78,38]];
  const GH=["🪦","🎃","💀","🧟","🧙","🎃","👻","🦇","🕯️","🧛","🎃","🪦"],GP=["FLAG","🦅","🎆","🏛️","FLAG","🎖️","🕊️","🎇","FLAG"];
  const build=()=>{fx.innerHTML='';(th==='pl'?PL:th==='hw'?HW:[]).forEach((a,i)=>{const sp=document.createElement("span");sp.className="fl";if(a[0]==='FLAG')sp.innerHTML='<span class="flag"></span>';else sp.textContent=a[0];sp.style.cssText=`left:${a[1]}%;top:${a[2]}%;font-size:${a[3]}px;animation-delay:-${(i*.7)%4}s;animation-duration:${3.5+(i%3)}s`;fx.appendChild(sp)});
    if(th!=='plain')[[12,17],[30,22],[22,26]].forEach((a,i)=>{const sp=document.createElement("span");sp.className="bat";sp.textContent=th==='pl'?'🕊️':'🦇';sp.style.cssText=`top:${a[0]}vh;animation-duration:${a[1]}s;animation-delay:-${i*7}s`;fx.appendChild(sp)});
    $("#gr").innerHTML=(th==='pl'?GP:GH).map((m,i)=>`<span style="animation-delay:${i*.25}s">${m==='FLAG'?'<span class="flag"></span>':m}</span>`).join("")};
  const apply=t=>{th=t;R.classList.remove('pl','plain');if(t==='pl')R.classList.add('pl');if(t==='plain')R.classList.add('plain');try{localStorage.setItem('luki_theme',t)}catch(e){}const g=$('#tg');if(g)g.textContent=t==='pl'?'🦅':t==='hw'?'🎃':'⚪';build()};
  $("#tg").onclick=()=>apply(th==='pl'?'hw':th==='hw'?'plain':'pl');apply(th);
  window.addEventListener('scroll',()=>{if(document.querySelector('.main #t,.main .dt'))window.__y=window.scrollY},{passive:true})})();
init();
})();
